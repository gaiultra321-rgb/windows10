name: Run Cloud Phone with Cloudflare
on: 
  workflow_dispatch:

jobs:
  run-android:
    runs-on: ubuntu-latest
    steps:
    - name: Start ReDroid (Android 11)
      run: |
        sudo docker run -d -p 5555:5555 \
          --privileged \
          --name redroid-phone \
          redroid/redroid:11.0.0-latest \
          androidboot.redroid_gpu_mode=guest

    - name: Start Ubuntu Web VNC Desktop
      run: |
        # এটি ব্রাউজারে একটি সম্পূর্ণ লাইটওয়েট লিনাক্স ডেস্কটপ ওপেন করবে পোর্ট ৮০ তে
        sudo docker run -d -p 80:80 \
          --name vnc-desktop \
          --link redroid-phone:phone \
          dorowu/ubuntu-desktop-lxde-vnc:latest

    - name: Connect Android to Web VNC Desktop
      run: |
        sleep 5
        # VNC ডেস্কটপের ভেতরে adb এবং scrcpy দিয়ে অ্যান্ড্রয়েড স্ক্রিনটি ওপেন করে দিচ্ছি
        sudo docker exec -d vnc-desktop apt-get update
        sudo docker exec -d vnc-desktop apt-get install -y adb scrcpy
        
        # ব্যাকগ্রাউন্ডে অ্যান্ড্রয়েডের সাথে কানেক্ট করে scrcpy স্ক্রিন অন করে দেওয়া
        sudo docker exec -d vnc-desktop adb connect phone:5555
        sudo docker exec -d vnc-desktop scrcpy --max-fps 30 --bit-rate 2M

    - name: Install & Run Cloudflare Tunnel
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        
        # পোর্ট ৮০ (যেখানে ওয়েব ইন্টারফেস আছে) সেটিকে ক্লাউডফ্লেয়ার টানেলে দেওয়া হলো
        cloudflared tunnel --url http://localhost:80 > cf.log 2>&1 &
        
    - name: Get Cloudflare Link and Keep Alive
      run: |
        sleep 12
        echo "=================================================="
        echo "আপনার ভার্চুয়াল ফোনের ক্লাউডফ্লেয়ার লিঙ্কটি নিচে দেখুন:"
        grep -o 'https://[^ ]*\.trycloudflare\.com' cf.log | head -n 1
        echo "=================================================="
        
        # ৩ ঘণ্টার জন্য সেশন চালু রাখতে (10800 সেকেন্ড)
        echo "ভার্চুয়াল ফোনটি সচল আছে..."
        sleep 10800
