name: Run Cloud Phone with Cloudflare
on: 
  workflow_dispatch:

jobs:
  run-android:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-size: 20
        node-version: 18

    - name: Start ReDroid (No GPU Mode)
      run: |
        sudo docker run -d -p 5555:5555 \
          --privileged \
          --name redroid-phone \
          redroid/redroid:11.0.0-latest \
          androidboot.redroid_gpu_mode=guest

    - name: Install & Start Web-Scrcpy via Node
      run: |
        # বিশ্বস্ত অফিসিয়াল সোর্স থেকে সরাসরি npm দিয়ে ইন্সটল করা হচ্ছে
        sudo npm install -g ws-scrcpy
        
        # ব্যাকগ্রাউন্ডে এটি রান করে দিচ্ছি যেন ৮০০০ পোর্টে ওয়েব ইন্টারফেস পাওয়া যায়
        ws-scrcpy > scrcpy.log 2>&1 &

    - name: Install & Run Cloudflare Tunnel
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        cloudflared tunnel --url http://localhost:8000 > cf.log 2>&1 &
        
    - name: Get Cloudflare Link and Keep Alive
      run: |
        sleep 12
        echo "=================================================="
        echo "আপনার ভার্চুয়াল ফোনের ক্লাউডফ্লেয়ার লিঙ্কটি নিচে দেখুন:"
        grep -o 'https://[^ ]*\.trycloudflare\.com' cf.log | head -n 1
        echo "=================================================="
        
        # ৩ ঘণ্টার জন্য সেশন চালু রাখতে (10800 সেকেন্ড)
        echo "ভার্চুয়াল ফোনটি সচল আছে..."
        sleep 10800
