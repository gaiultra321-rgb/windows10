name: Run Cloud Phone with Cloudflare
on: 
  workflow_dispatch:

jobs:
  run-android:
    runs-on: ubuntu-latest
    steps:
    - name: Start ReDroid (Android 11)
      run: |
        sudo docker run -d -p 5555:5555 \
          --privileged \
          --name redroid-phone \
          redroid/redroid:11.0.0-latest \
          androidboot.redroid_gpu_mode=guest

    - name: Start Ubuntu Web VNC Desktop
      run: |
        # এটি ব্রাউজারে একটি সম্পূর্ণ লাইটওয়েট লিনাক্স ডেস্কটপ ওপেন করবে পোর্ট ৮০ তে
        sudo docker run -d -p 80:80 \
          --name vnc-desktop \
          --link redroid-phone:phone \
          dorowu/ubuntu-desktop-lxde-vnc:latest

    - name: Configure Tools inside VNC Desktop
      run: |
        sleep 15
        # গুগল ক্রোমের সমস্যা করা পুরনো রিপোজিটরি ফাইলটি রিমুভ করে দেওয়া হচ্ছে
        sudo docker exec vnc-desktop rm -f /etc/apt/sources.list.d/google-chrome.list
        
        # এবার আপডেট এবং ইনস্টল করা হচ্ছে
        sudo docker exec vnc-desktop apt-get update
        sudo docker exec vnc-desktop apt-get install -y adb scrcpy
        
        # অ্যান্ড্রয়েড কন্টেইনারটি বুট হওয়া শেষ করার জন্য আরও ৫ সেকেন্ড অপেক্ষা
        sleep 5
        
        # HOME এনভায়রনমেন্ট ভ্যারিয়েবল সহ adb কানেক্ট করা হচ্ছে
        sudo docker exec -e HOME=/root vnc-desktop adb connect phone:5555
        
        # ডকার সিনট্যাক্স ঠিক করে ব্যাকগ্রাউন্ডে scrcpy স্ক্রিন অন করা হচ্ছে
        sudo docker exec -d -e HOME=/root -e DISPLAY=:1 vnc-desktop scrcpy --max-fps 30 --bit-rate 2M

    - name: Install & Run Cloudflare Tunnel
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        
        # পোর্ট ৮০ ক্লাউডফ্লেয়ার টানেলে দেওয়া হলো
        cloudflared tunnel --url http://localhost:80 > cf.log 2>&1 &
        
    - name: Get Cloudflare Link and Keep Alive
      run: |
        sleep 12
        echo "=================================================="
        echo "আপনার ভার্চুয়াল জনের ক্লাউডফ্লেয়ার লিঙ্কটি নিচে দেখুন:"
        grep -o 'https://[^ ]*\.trycloudflare\.com' cf.log | head -n 1
        echo "=================================================="
        
        # ৩ ঘণ্টার জন্য সেশন চালু রাখতে (10800 সেকেন্ড)
        echo "ভার্চুয়াল ফোনটি সচল আছে..."
        sleep 10800
