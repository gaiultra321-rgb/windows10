name: Run Cloud Phone with Cloudflare
on: 
  workflow_dispatch:

jobs:
  run-android:
    runs-on: ubuntu-latest
    steps:
    - name: Start ReDroid (No GPU Mode)
      run: |
        sudo docker run -d -p 5555:5555 \
          --privileged \
          --name redroid-phone \
          redroid/redroid:11.0.0-latest \
          androidboot.redroid_gpu_mode=guest

    - name: Install Web-Scrcpy (Updated Image)
      run: |
        # আগেরটি কাজ না করায় এখানে নতুন ও আপডেটেড ওয়েব ইন্টারফেস ইমেজ ব্যবহার করা হয়েছে
        sudo docker run -d -p 8000:8000 \
          --name web-scrcpy \
          --link redroid-phone:phone \
          -e ADB_SERVER_SOCKET=tcp:phone:5555 \
          emptysuns/scrcpy-web:latest

    - name: Install & Run Cloudflare Tunnel
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        cloudflared tunnel --url http://localhost:8000 > cf.log 2>&1 &
        
    - name: Get Cloudflare Link and Keep Alive
      run: |
        sleep 10
        echo "=================================================="
        echo "আপনার ভার্চুয়াল ফোনের ক্লাউডফ্লেয়ার লিঙ্কটি নিচে দেখুন:"
        grep -o 'https://[^ ]*\.trycloudflare\.com' cf.log | head -n 1
        echo "=================================================="
        
        # ৩ ঘণ্টার জন্য সেশন চালু রাখতে (10800 সেকেন্ড)
        echo "ভার্চুয়াল ফোনটি সচল আছে..."
        sleep 10800
